name: test

on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check core.js
      - run: node --check dom.js
      - run: node --check bridge.js
      - run: node --check background.js
      - run: node --test tests/core.test.cjs
